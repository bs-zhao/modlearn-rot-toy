name: Toy diagnostics
on:
  push:
  workflow_dispatch:
jobs:
  analytic-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python tests/test_toys.py
      - run: python tests/test_dual_backend.py
      - run: python tests/test_registry.py
      - run: python tests/test_functional_operators.py
      - name: Generate preview plots
        run: python run.py --models T1 T3 --wrappers identity --u-points 8 --x-points 24 --sweep-steps 21 --angles 19
      - uses: actions/upload-artifact@v4
        with:
          name: toy-rotation-preview
          path: outputs/toy_rotation/
